name: feast
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Existing — keep
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  mobile_scanner: ^5.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

  # State management (Fase M1)
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP client (Fase M1)
  dio: ^5.7.0
  http: ^1.2.0

  # Secure token storage (Fase M1)
  flutter_secure_storage: ^9.2.2

  # Routing (Fase M1)
  go_router: ^14.6.3

  # Realtime / WebSocket (Fase M6)
  web_socket_channel: ^3.0.1

  # Frozen models + JSON (Fase M1 toolchain)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image caching (Fase M4)
  cached_network_image: ^3.4.1

  # QR code rendering from raw QRIS string (Fase M5)
  qr_flutter: ^4.1.0

  # QR download & share (Fase M5)
  share_plus: ^10.1.0
  gal: ^1.1.0

  # Image picker for profile photo upload (Fase M7)
  image_picker: ^1.1.2

  # Device location for sort-by-distance (Brands screen)
  geolocator: ^13.0.1

  # PDF receipt generation + print/save (F3)
  pdf: ^3.11.0
  printing: ^5.13.1

  # Push notifications via FCM (F1B)
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/heroImage.png"
